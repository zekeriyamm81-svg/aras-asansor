<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim Girişi</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="admin-bg"><form class="login-card" method="post"><img src="{{ url_for('static', filename='aras-logo.jpg') }}"><h1>Yönetim Paneli</h1><p>Aras Asansör teklif yönetimi</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<label>Kullanıcı adı<input name="username" required></label><label>Şifre<input name="password" type="password" required></label><button class="submit">Giriş Yap</button></form></body></html>
